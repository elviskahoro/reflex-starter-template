# Reflex production build smoke test (see .trunk/trunk.yaml: merge.required_statuses).
#
# This template's deploy path (Dockerfile, Caddyfile) produces a static frontend
# via `reflex export --frontend-only`. Running that here is the cheapest "does
# this still compile into a shippable artifact?" gate a starter template can
# have: it pulls Node once, exports the SPA, and exits. Catches broken page
# imports, missing runtime deps, and template regressions that pure lint and
# pytest would miss.
#
# Cost discipline: the .web/ directory is the heavy payload here (~300MB of
# bun + a JS toolchain). Caching it across runs saves ~2-3 minutes on cache
# hits; the cache key is keyed on `uv.lock` so a dependency bump correctly
# invalidates stale toolchains.
#
# Triggers match the other merge-queue gates so a queued PR stack exercises
# the build under the same merge ref.
name: Reflex build

concurrency:
  group: reflex-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
      - trunk-merge/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reflex-build:
    # Must match .trunk/trunk.yaml merge.required_statuses.
    name: Reflex build
    runs-on: ubuntu-latest
    # reflex init + pull-bun + export can stall on a flaky mirror; cap the
    # total runtime well below GitHub's 6h default so the merge queue
    # surfaces failures quickly instead of timing out.
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Plain `uv sync --frozen` installs only `[project].dependencies`
      # (just `reflex`). The build job doesn't need pytest, pyrefly,
      # pyright, or tach; the lint and test jobs install those via
      # `--group dev` separately.
      - name: Install dependencies
        run: uv sync --frozen

      # `reflex init` downloads the JS toolchain (bun) into .web/ on
      # first run and is the heaviest step. Caching keyed on uv.lock
      # avoids re-downloading on PR-from-main pushes that don't touch
      # dependencies. The cache miss path rebuilds cleanly.
      - name: Cache .web (bun + JS toolchain)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .web
          # Keyed on `uv.lock` so a Reflex/bun upgrade invalidates the
          # cached toolchain. No `restore-keys` fallback: a stale
          # `.web` from a previous lockfile quietly hides bun/JS
          # rot, the same problem the nightly's cold build exists to
          # catch.
          key: reflex-web-${{ hashFiles('uv.lock') }}

      - name: Export frontend
        run: |
          uv run reflex init
          uv run reflex export --frontend-only
        env:
          # Match production defaults so the smoke test isn't more permissive
          # than the deploy (see Dockerfile).
          REFLEX_ENV: prod
          PYTHONUNBUFFERED: "1"
