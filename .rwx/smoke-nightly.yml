on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        repository: https://github.com/elviskahoro/reflex-starter-template.git
        event-type: push
      if: ${{ event.git.branch == 'main' }}
      # Note: schedule trigger is configured in RWX Cloud, not here.
      # This pipeline runs nightly at 06:30 UTC on weekdays.
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      repository: https://github.com/elviskahoro/reflex-starter-template.git
      event-type: push
      before-sha: ""

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: ${{ init.repository }}
      ref: ${{ init.commit-sha }}
      fetch-full-depth: true
      preserve-git-dir: true

  - key: uv-install
    run: |
      set -euo pipefail
      script="$(mktemp)"
      trap 'rm -f "${script}"' EXIT
      curl -LsSf https://astral.sh/uv/0.11.13/install.sh -o "${script}"
      echo "48cd5aca5d5671a3b3d5f61538cc8622e4434af63319115159990d8b0dd02416  ${script}" | sha256sum -c -
      sh "${script}"
      echo "$HOME/.local/bin" >> $RWX_ENV/PATH

  - key: deps-dev
    use: [code, uv-install]
    filter:
      - pyproject.toml
      - uv.lock
    run: |
      uv sync --frozen --group dev
      echo "$PWD/.venv/bin" >> $RWX_ENV/PATH
      echo "VIRTUAL_ENV=$PWD/.venv" >> $RWX_ENV/VIRTUAL_ENV
    # Re-sync from PyPI at least weekly so a yanked or removed distribution
    # still surfaces on the nightly even when the lockfiles are unchanged.
    cache:
      ttl: 7 days

  - key: deps-prod
    use: [code, uv-install]
    filter:
      - pyproject.toml
      - uv.lock
    run: |
      uv sync --frozen
      echo "$PWD/.venv/bin" >> $RWX_ENV/PATH
      echo "VIRTUAL_ENV=$PWD/.venv" >> $RWX_ENV/VIRTUAL_ENV
    # Re-sync from PyPI at least weekly so a yanked or removed distribution
    # still surfaces on the nightly even when the lockfiles are unchanged.
    cache:
      ttl: 7 days

  - key: captain
    call: rwx/install-captain 1.2.0

  - key: nightly-pytest
    use: [code, deps-dev, captain]
    run: |
      captain run reflex-starter-template-pytest-nightly \
        --command "uv run pytest -q --report-log=pytest-results.json" \
        --retry-command "uv run pytest -q --report-log=pytest-results.json {{ tests }}" \
        --retries 2 \
        --test-results pytest-results.json \
        --print-summary

  - key: nightly-reflex-export
    use: [code, deps-dev]
    run: |
      uv run reflex init
      uv run reflex export --frontend-only
    env:
      REFLEX_ENV: prod
      PYTHONUNBUFFERED: "1"
