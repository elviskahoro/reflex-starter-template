on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        repository: https://github.com/elviskahoro/reflex-starter-template.git
        event-type: push
        before-sha: ${{ event.github.push.before }}
      if: ${{ event.git.branch == 'main' || starts-with(event.git.branch, 'trunk-merge/') }}
      # Name the default per-run status check so merge.required_statuses
      # (.trunk/trunk.yaml) can require this pipeline by a name that posts
      # identically on PR heads and trunk-merge/** batch refs. See
      # .rwx/trunk-check.yml for the full rationale.
      status-checks:
        name: pytest
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        repository: https://github.com/elviskahoro/reflex-starter-template.git
        event-type: pull_request
        base-sha: ${{ event.github.pull_request.pull_request.base.sha }}
      if: ${{ event.github.pull_request.pull_request.base.ref == 'main' }}
      # Same stable name as the push trigger above.
      status-checks:
        name: pytest
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      repository: https://github.com/elviskahoro/reflex-starter-template.git
      event-type: push
      before-sha: ""

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.4.0
    with:
      repository: ${{ init.repository }}
      ref: ${{ init.commit-sha }}
      fetch-full-depth: true
      preserve-git-dir: true

  - key: uv-install
    run: |
      set -euo pipefail
      script="$(mktemp)"
      trap 'rm -f "${script}"' EXIT
      curl -LsSf https://astral.sh/uv/0.11.13/install.sh -o "${script}"
      echo "48cd5aca5d5671a3b3d5f61538cc8622e4434af63319115159990d8b0dd02416  ${script}" | sha256sum -c -
      sh "${script}"
      echo "$HOME/.local/bin" >> $RWX_ENV/PATH

  - key: dagger-cli-install
    run: |
      set -euo pipefail
      version="0.21.8"
      archive="$(mktemp)"
      trap 'rm -f "${archive}"' EXIT
      curl -fsSL "https://dl.dagger.io/dagger/releases/${version}/dagger_v${version}_linux_amd64.tar.gz" -o "${archive}"
      echo "53e226c7da8fb75171e58c35759d736d961ce8b3a12db0baa7b7107954fccc5a  ${archive}" | sha256sum -c -
      mkdir -p "$HOME/.local/bin"
      tar -C "$HOME/.local/bin" -xzf "${archive}" dagger
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  # Filtered to ci/'s lockfile inputs: stays a cache hit across source commits.
  - key: dagger-sdk-install
    use: [uv-install, code]
    filter:
      - ci/pyproject.toml
      - ci/uv.lock
    run: |
      set -euo pipefail
      (cd ci && uv sync --frozen)
      echo "$PWD/ci/.venv/bin/python" >> "$RWX_ENV/CI_PYTHON"

  # Pre-pull the engine image so the Dagger task does not pay the cold pull.
  - key: dagger-engine-warm
    use: [dagger-cli-install]
    docker: preserve-data
    run: |
      set -euo pipefail
      for i in 1 2 3; do
        docker pull registry.dagger.io/engine:v0.21.8 && exit 0
        sleep 5
      done
      exit 1

  - key: captain
    call: rwx/install-captain 1.2.0

  - key: pytest
    use: [code, dagger-cli-install, dagger-sdk-install, dagger-engine-warm, captain]
    docker: true
    timeout: 30m
    run: |
      captain run reflex-starter-template-pytest \
        --command "ci/run.sh test" \
        --retry-command "ci/run.sh test -- {{ tests }}" \
        --retries 2 \
        --test-results pytest-results.json \
        --print-summary
